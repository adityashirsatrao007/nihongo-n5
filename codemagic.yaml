workflows:
  ios-build:
    name: Nihongo N5 IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.nihongo.n5
      groups:
        - code_signing
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prebuild native project
        script: npx expo prebuild --platform ios --clean
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          cd ios
          WORKSPACE=$(ls *.xcworkspace 2>/dev/null | head -1)
          SCHEME=$(ls *.xcodeproj | head -1 | sed 's/\.xcodeproj//')
          xcode-project build-ipa \
            --workspace "$(pwd)/$WORKSPACE" \
            --scheme "$SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/build/**/*.ipa
    publishing:
      email:
        recipients:
          - adityashirsatrao007@gmail.com
