workflows:
  ios-build:
    name: Nihongo N5 IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      groups:
        - apple_credentials
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prebuild native project
        script: npx expo prebuild --platform ios --clean
      - name: Find workspace and build IPA
        script: |
          set -e
          cd ios
          WORKSPACE=$(ls *.xcworkspace 2>/dev/null | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "No workspace found"; exit 1
          fi
          SCHEME=$(ls *.xcodeproj | head -1 | sed 's/\.xcodeproj//')
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/NihongoN5.xcarchive \
            -allowProvisioningUpdates \
            archive
          xcodebuild -exportArchive \
            -archivePath build/NihongoN5.xcarchive \
            -exportPath build \
            -exportOptionsPlist "../export.plist" \
            -allowProvisioningUpdates
    artifacts:
      - ios/build/*.ipa
    publishing:
      email:
        recipients:
          - adityashirsatrao007@gmail.com
